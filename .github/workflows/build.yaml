on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          activate-environment: "true"

      - run: uv sync --frozen

      - run: zensical build
